[metadata]
name = mark2tex
version = 0.2.0
description = Compile Markdown to PDF with Mark2TeX and LuaLaTeX
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
package_dir =
    = cli
packages = find:
python_requires = >=3.9

[options.packages.find]
where = cli

[options.package_data]
mark2tex_cli = templates/*.tex

[options.entry_points]
console_scripts =
    mark2tex = mark2tex_cli.cli:main
